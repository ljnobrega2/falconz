# =============================================================================
# Senderzz — Docker Compose (todas as Fases do Strangler Fig)
#
# Serviços Go:
#   motoboy-service  :8080  — Fase 1 (sz-motoboy/v1)
#   wallet-service   :8081  — Fase 2 (tp-carteira/v1)
#   affiliates-service :8083 — Fase 3 (senderzz/v1 affiliates)
#   labels-service   :8084  — Fase 4 (wc-melhor-envio/v1)
#   portal-service   :8085  — Fase 5 (senderzz/v1 portal)
#   orders-service   :8086  — Fase 6 (senderzz/v1 orders)
#
# Uso:
#   cp .env.example .env
#   docker compose up -d
#
# Para Fase 1 apenas: docker compose up -d postgres redis motoboy-service
# Para todas as Fases: docker compose up -d
# =============================================================================
#
# AUDIT INFRA-healthcheck-readiness — readiness dos 7 serviços Go
# -----------------------------------------------------------------------------
# Os serviços Go expõem endpoint de readiness HTTP:
#   motoboy-service     GET :8080/health   (faz pool.Ping → 503 se DB down)
#   wallet-service      GET :8081/health
#   affiliates-service  GET :8083/health
#   labels-service      GET :8084/health
#   portal-service      GET :8085/health
#   orders-service      GET :8086/health
#   admin-service       GET :8087/healthz
#
# POR QUE NÃO HÁ bloco `healthcheck:` em CADA serviço Go aqui:
#   6 dos 7 binários são `FROM scratch` (ver go/<svc>/Dockerfile) — imagem SEM
#   shell, curl ou wget. Um `healthcheck:` com test CMD/CMD-SHELL curl rodaria
#   DENTRO do container e falharia sempre (binário ausente) → marcaria o serviço
#   'unhealthy' permanentemente. Como há dependências `condition: service_healthy`
#   /`service_completed_successfully` na cadeia, isso causaria DEADLOCK de startup.
#   (admin é `alpine` e teria shell, mas mantemos a convenção uniforme.)
#
# ONDE a readiness É verificada (externamente, do host, onde curl existe):
#   infra/scripts/deploy-service.sh:99-108 e deploy-admin.sh:90-96 fazem
#   `curl -sf http://localhost:<porta><HEALTH_PATH>` em loop após `up -d`.
#   Em prod (nginx/LB) o gateway pode sondar os mesmos /health.
# postgres e redis MANTÊM healthcheck (imagens oficiais têm pg_isready/redis-cli)
# pois os serviços Go dependem deles via service_healthy.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Postgres 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-senderzz}
      POSTGRES_USER:     ${POSTGRES_USER:-senderzz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      TZ:   America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      # AUDIT-2026-06-21 H5: bind só em loopback — Docker publica passando por cima da UFW.
      # Postgres é puramente interno; nginx/host alcança via 127.0.0.1. Nunca expor na pública.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # AUDIT INFRA-docker-compose-schema-divergence: removidos os mounts em
      # /docker-entrypoint-initdb.d. Aplicavam só 7 de ~29 schemas (drift dev/prod)
      # e initdb.d SÓ roda na 1ª criação do volume (nunca em restart / volume já
      # existente → schemas novos jamais aplicados). Os schemas agora são aplicados
      # pelo serviço 'migrate-runner' (scripts/db-migrate.sh, versionado em
      # schema_migrations, idempotente, TODOS os .sql em ordem de dependência).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-senderzz} -d ${POSTGRES_DB:-senderzz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis 7 — Asynq queues + cache CEP + OTP storage
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # AUDIT-2026-06-21 H5: loopback-only (Redis interno; Docker fura a UFW se 0.0.0.0).
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # AUDIT INFRA-docker-compose-schema-divergence
  # migrate-runner — aplica TODOS os schemas via scripts/db-migrate.sh e SAI 0.
  # Substitui os mounts initdb.d (que aplicavam só 7 de 29 e só na 1ª criação do
  # volume). Os serviços Go esperam este job completar (service_completed_successfully).
  # Imagem postgres:16 (Debian) tem bash+psql; db-migrate.sh usa arrays bash.
  # DATABASE_URL aponta p/ host de serviço 'postgres' (NÃO localhost) dentro da rede.
  # ---------------------------------------------------------------------------
  migrate-runner:
    image: postgres:16
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-senderzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-senderzz}?sslmode=disable
      TZ: America/Sao_Paulo
      # FAIL-CLOSED: default = 0 (NÃO aplica seeds de demo). Os seeds demo
      # (910-seed-dev-demo, seed-demo-*, seed-cod-wallet-*) só entram com
      # APPLY_SEEDS=1 EXPLÍCITO no .env — necessário porque:
      #   a) seed-demo-producer46.sql tem FK quebrada (zona_id ausente) → faria o
      #      migrate-runner SAIR != 0 e travar todos os serviços Go
      #      (service_completed_successfully) se rodasse por default;
      #   b) em prod nunca se quer demo data. Antes era `:-1` (ligava por engano).
      # Para popular demo em DEV: APPLY_SEEDS=1 no infra/docker/.env.
      APPLY_SEEDS: ${APPLY_SEEDS:-0}
    volumes:
      # repo montado read-only: o runner lê scripts/db-migrate.sh + infra/postgres/*.sql
      - ../../:/repo:ro
    entrypoint: ["bash", "/repo/infra/docker/migrate-entrypoint.sh"]
    depends_on:
      postgres: { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # Fase 1: Motoboy (sz-motoboy/v1)
  # ---------------------------------------------------------------------------
  motoboy-service:
    build:
      context: ../../go/motoboy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:              postgresql://${POSTGRES_USER:-senderzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-senderzz}?sslmode=disable
      REDIS_URL:                 redis://redis:6379/0
      PORT:                      ${MOTOBOY_PORT:-8080}
      WP_SALT_AUTH:              ${WP_SALT_AUTH:?}
      JWT_SECRET:                ${JWT_SECRET:?}
      MOTOBOY_INTERNAL_SECRET:   ${MOTOBOY_INTERNAL_SECRET:-}
      TZ:                        America/Sao_Paulo
      APP_ENV:                   ${APP_ENV:-development}
      # AUDIT-2026-06-18: allowlist CORS (CSV). Vazio = nega CORS credentialed cross-origin.
      ALLOWED_ORIGINS:           ${ALLOWED_ORIGINS:-}
    ports:
      # AUDIT-2026-06-21 H5: serviços Go atrás do nginx do host → loopback-only, fora da pública.
      - "127.0.0.1:${MOTOBOY_PORT:-8080}:8080"
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis:    { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # Fase 2: Wallet + PIX (tp-carteira/v1)
  # ---------------------------------------------------------------------------
  wallet-service:
    build:
      context: ../../go/wallet
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:             postgresql://${POSTGRES_USER:-senderzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-senderzz}?sslmode=disable
      REDIS_URL:                redis://redis:6379/1
      PORT:                     ${WALLET_PORT:-8081}
      JWT_SECRET:               ${JWT_SECRET:?}
      WEBHOOK_SECRET:           ${WEBHOOK_SECRET:?}
      # G3: wallet lê WP_SALT_AUTH (handlers/auth.go) p/ validar sessão de painel.
      # Fail-closed: vazio = rejeita sessão. Cabeado via ${VAR:?}.
      WP_SALT_AUTH:             ${WP_SALT_AUTH:?}
      WALLET_INTERNAL_SECRET:   ${WALLET_INTERNAL_SECRET:-}
      ME_TOKEN:                 ${ME_TOKEN:-}
      TZ:                       America/Sao_Paulo
    ports:
      - "127.0.0.1:${WALLET_PORT:-8081}:8081"
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis:    { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # Fase 3: Affiliates + COD (senderzz/v1 affiliates)
  # ---------------------------------------------------------------------------
  affiliates-service:
    build:
      context: ../../go/affiliates
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:                  postgresql://${POSTGRES_USER:-senderzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-senderzz}?sslmode=disable
      REDIS_URL:                     redis://redis:6379/2
      PORT:                          ${AFFILIATES_PORT:-8083}
      JWT_SECRET:                    ${JWT_SECRET:?}
      # G2: affiliates lê WP_SALT_AUTH (auth/auth.go) p/ validar sessão portal.
      # Fail-closed: vazio = rejeita toda sessão portal. Cabeado via ${VAR:?}.
      WP_SALT_AUTH:                  ${WP_SALT_AUTH:?}
      AFFILIATES_INTERNAL_SECRET:    ${AFFILIATES_INTERNAL_SECRET:-}
      TZ:                            America/Sao_Paulo
    ports:
      - "127.0.0.1:${AFFILIATES_PORT:-8083}:8083"
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis:    { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # Fase 4: Labels + Melhor Envio (wc-melhor-envio/v1)
  # ---------------------------------------------------------------------------
  labels-service:
    build:
      context: ../../go/labels
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER:-senderzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-senderzz}?sslmode=disable
      REDIS_URL:       redis://redis:6379/3
      PORT:            ${LABELS_PORT:-8084}
      JWT_SECRET:      ${JWT_SECRET:?}
      ME_TOKEN:        ${ME_TOKEN:?}
      ME_BASE_URL:     ${ME_BASE_URL:-https://melhorenvio.com.br/api/v2}
      # G5: labels lê TRACKING_WEBHOOK_SECRET (handlers/labels.go) p/ verificar
      # HMAC do webhook de rastreio. Fail-closed: vazio = recusa o webhook.
      # Cabeado via ${VAR:?} → exige TRACKING_WEBHOOK_SECRET no .env.
      TRACKING_WEBHOOK_SECRET: ${TRACKING_WEBHOOK_SECRET:?}
      TZ:              America/Sao_Paulo
    ports:
      - "127.0.0.1:${LABELS_PORT:-8084}:8084"
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis:    { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # Fase 5: Portal (senderzz/v1 portal)
  # ---------------------------------------------------------------------------
  portal-service:
    build:
      context: ../../go/portal
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER:-senderzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-senderzz}?sslmode=disable
      REDIS_URL:       redis://redis:6379/4
      PORT:            ${PORTAL_PORT:-8085}
      JWT_SECRET:      ${JWT_SECRET:?}
      WP_SALT_AUTH:    ${WP_SALT_AUTH:?}
      SMTP_HOST:       ${SMTP_HOST:-localhost}
      SMTP_PORT:       ${SMTP_PORT:-587}
      SMTP_USER:       ${SMTP_USER:-}
      SMTP_PASS:       ${SMTP_PASS:-}
      TZ:              America/Sao_Paulo
      # AUDIT-2026-06-18: allowlist CORS (CSV). Vazio = nega CORS credentialed cross-origin.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${PORTAL_PORT:-8085}:8085"
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis:    { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # Fase 6: Orders (senderzz/v1 orders) — substitui WooCommerce
  # ---------------------------------------------------------------------------
  orders-service:
    build:
      context: ../../go/orders
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER:-senderzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-senderzz}?sslmode=disable
      REDIS_URL:       redis://redis:6379/5
      PORT:            ${ORDERS_PORT:-8086}
      JWT_SECRET:      ${JWT_SECRET:?}
      # G1: orders lê WP_SALT_AUTH (auth/auth.go → sessão portal) e WEBHOOK_SECRET
      # (handlers/payments.go → HMAC do webhook de pagamento). Ambos fail-closed:
      # vazio = rejeita sessão / recusa webhook. Cabeados via ${VAR:?}.
      WP_SALT_AUTH:    ${WP_SALT_AUTH:?}
      WEBHOOK_SECRET:  ${WEBHOOK_SECRET:?}
      WALLET_URL:      http://wallet-service:8081
      MOTOBOY_URL:     http://motoboy-service:8080
      TZ:              America/Sao_Paulo
    ports:
      - "127.0.0.1:${ORDERS_PORT:-8086}:8086"
    depends_on:
      postgres:         { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis:            { condition: service_healthy }
      wallet-service:   { condition: service_started }
      motoboy-service:  { condition: service_started }

  # ---------------------------------------------------------------------------
  # Admin API (senderzz/v1/admin) — painel Go
  # ---------------------------------------------------------------------------
  admin-service:
    build:
      context: ../../go/admin
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql://${POSTGRES_USER:-senderzz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-senderzz}?sslmode=disable
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
      JWT_SECRET:      ${JWT_SECRET:?}
      APP_BASE_URL:    ${APP_BASE_URL:-https://app.senderzz.com.br}
      LABELS_SERVICE_URL: ${LABELS_SERVICE_URL:-http://labels-service:8084}
      ME_TOKEN:        ${ME_TOKEN:?}
      ME_API_URL:      ${ME_API_URL:-https://melhorenvio.com.br/api/v2}
      PORT:            ${ADMIN_PORT:-8087}
      TZ:              America/Sao_Paulo
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8087}:8087"
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }

  # ---------------------------------------------------------------------------
  # Admin UI (React SPA via nginx) — serve estático na porta 8089
  # ---------------------------------------------------------------------------
  admin-ui:
    build:
      context: ../../admin-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMIN_UI_PORT:-8089}:80"

volumes:
  pg_data:
    driver: local
