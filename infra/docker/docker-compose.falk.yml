# FALK — stack separada (app.falklog.com.br). Go+DB internos; gateway+lp em 127.0.0.1.
name: falk
services:
  postgres:
    image: postgres:16-alpine
    container_name: falk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-falk}
      POSTGRES_USER: ${POSTGRES_USER:-falk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - falk_pg_data:/var/lib/postgresql/data
    networks: [falk-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-falk} -d ${POSTGRES_DB:-falk}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: falk-redis
    restart: unless-stopped
    networks: [falk-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate-runner:
    image: postgres:16
    container_name: falk-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-falk}?sslmode=disable
      APPLY_SEEDS: ${APPLY_SEEDS:-0}
      TZ: America/Sao_Paulo
    volumes:
      - ../../:/repo:ro
    entrypoint: ["bash", "/repo/infra/docker/migrate-entrypoint.sh"]
    networks: [falk-net]
    depends_on:
      postgres: { condition: service_healthy }

  motoboy-service:
    build: { context: ../../go/motoboy, dockerfile: Dockerfile }
    container_name: falk-motoboy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-falk}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      PORT: 8080
      WP_SALT_AUTH: ${WP_SALT_AUTH:?}
      JWT_SECRET: ${JWT_SECRET:?}
      MOTOBOY_INTERNAL_SECRET: ${MOTOBOY_INTERNAL_SECRET:-}
      TZ: America/Sao_Paulo
      APP_ENV: ${APP_ENV:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    networks: [falk-net]
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  wallet-service:
    build: { context: ../../go/wallet, dockerfile: Dockerfile }
    container_name: falk-wallet
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-falk}?sslmode=disable
      REDIS_URL: redis://redis:6379/1
      PORT: 8081
      JWT_SECRET: ${JWT_SECRET:?}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?}
      WP_SALT_AUTH: ${WP_SALT_AUTH:?}
      WALLET_INTERNAL_SECRET: ${WALLET_INTERNAL_SECRET:-}
      ME_TOKEN: ${ME_TOKEN:-}
      ASYNQ_REDIS_ADDR: redis:6379
      TZ: America/Sao_Paulo
    networks: [falk-net]
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  affiliates-service:
    build: { context: ../../go/affiliates, dockerfile: Dockerfile }
    container_name: falk-affiliates
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-falk}?sslmode=disable
      REDIS_URL: redis://redis:6379/2
      PORT: 8083
      JWT_SECRET: ${JWT_SECRET:?}
      WP_SALT_AUTH: ${WP_SALT_AUTH:?}
      AFFILIATES_INTERNAL_SECRET: ${AFFILIATES_INTERNAL_SECRET:-}
      TZ: America/Sao_Paulo
    networks: [falk-net]
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  labels-service:
    build: { context: ../../go/labels, dockerfile: Dockerfile }
    container_name: falk-labels
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-falk}?sslmode=disable
      REDIS_URL: redis://redis:6379/3
      PORT: 8084
      JWT_SECRET: ${JWT_SECRET:?}
      ME_TOKEN: ${ME_TOKEN:?}
      ME_BASE_URL: ${ME_BASE_URL:-https://melhorenvio.com.br/api/v2}
      # 17TRACK: eventos detalhados da transportadora (opcional; polling a cada 12h).
      TRACKING17_TOKEN: ${TRACKING17_TOKEN:-}
      TRACKING17_BASE_URL: ${TRACKING17_BASE_URL:-https://api.17track.net/track/v2.4}
      TRACKING_WEBHOOK_SECRET: ${TRACKING_WEBHOOK_SECRET:?}
      # Webhook NATIVO Melhor Envio (x-me-signature HMAC). = client_secret do app ME.
      # Vazio = handshake/ping responde, mas eventos assinados são recusados (fail-closed).
      ME_WEBHOOK_SECRET: ${ME_WEBHOOK_SECRET:-}
      # Wallet: reserva saldo antes de ME.CreateShipment. Vazio = sem débito (labels grátis).
      WALLET_SERVICE_URL: http://wallet-service:8081
      WALLET_INTERNAL_SECRET: ${WALLET_INTERNAL_SECRET:-}
      # AUDIT-2026-07-30/31: secret compartilhado das rotas /internal/* (mesmo
      # valor no admin-service, ver abaixo). Vazio = opt-in desligado (só
      # isolamento de rede, sem defesa em profundidade).
      LABELS_INTERNAL_SECRET: ${LABELS_INTERNAL_SECRET:-}
      TZ: America/Sao_Paulo
    networks: [falk-net]
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  portal-service:
    build: { context: ../../go/portal, dockerfile: Dockerfile }
    container_name: falk-portal
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-falk}?sslmode=disable
      REDIS_URL: redis://redis:6379/4
      PORT: 8085
      JWT_SECRET: ${JWT_SECRET:?}
      WP_SALT_AUTH: ${WP_SALT_AUTH:?}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      TZ: America/Sao_Paulo
      APP_ENV: ${APP_ENV:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # FEAT-DOC-CHANGE-2026-07-03 — anexos PRIVADOS de cartão CNPJ (troca CPF⇄CNPJ).
      # Mesmo volume falk_uploads do admin: o portal grava, o admin lê (endpoint auth).
      DOC_CHANGE_UPLOAD_PATH: /app/uploads/doc-changes
      PRODUCT_IMG_UPLOAD_PATH: /app/uploads/products
      # AUDIT-2026-07-27 — Aprovar expedição chama emissão 1-click no labels-service
      # (autoEmitLabel em expedicao.go), mesmo padrão de LABELS_SERVICE_URL do admin-service.
      LABELS_SERVICE_URL: http://labels-service:8084
      # AUDIT-2026-07-28 — Reprocessar última tentativa de pedido via API chama
      # o orders-service internamente (rota /internal/api-orders/reprocess-last).
      ORDERS_SERVICE_URL: http://orders-service:8086
    volumes:
      - falk_uploads:/app/uploads
    networks: [falk-net]
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  orders-service:
    build: { context: ../../go/orders, dockerfile: Dockerfile }
    container_name: falk-orders
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-falk}?sslmode=disable
      REDIS_URL: redis://redis:6379/5
      PORT: 8086
      JWT_SECRET: ${JWT_SECRET:?}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-}
      WP_SALT_AUTH: ${WP_SALT_AUTH:?}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?}
      WALLET_URL: http://wallet-service:8081
      MOTOBOY_URL: http://motoboy-service:8080
      # AUDIT-2026-07-30 #6: consulta ao vivo (read-only) no rastreio público
      # (tracking.go), best-effort — ver InternalMEStatusLive no labels-service.
      LABELS_SERVICE_URL: http://labels-service:8084
      # Melhor Envio: cotação real de frete no checkout (calc.go). Sem token → fallback estimado.
      ME_TOKEN: ${ME_TOKEN:-}
      ME_BASE_URL: ${ME_BASE_URL:-https://melhorenvio.com.br/api/v2}
      TZ: America/Sao_Paulo
    networks: [falk-net]
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      wallet-service: { condition: service_started }
      motoboy-service: { condition: service_started }

  admin-service:
    build: { context: ../../go/admin, dockerfile: Dockerfile }
    container_name: falk-admin
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-falk}?sslmode=disable
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?}
      # FEAT-RBAC-2026-06-21 — login unificado: admin-service valida tb portal_users
      # e emite token PORTAL (iss=senderzz-portal, JWT_SECRET) + cria sessão (WP_SALT_AUTH).
      JWT_SECRET: ${JWT_SECRET:?}
      WP_SALT_AUTH: ${WP_SALT_AUTH:?}
      APP_BASE_URL: ${APP_BASE_URL:-https://app.falklog.com.br}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://app.falklog.com.br}
      APP_ENV: ${APP_ENV:-production}
      # Recuperação de senha do login unificado é atendida pelo admin-service.
      # Repassa o transporte já configurado no .env para o envio do link.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-contato@falklog.com.br}
      PORT: 8087
      TZ: America/Sao_Paulo
      PRODUCT_IMG_UPLOAD_PATH: /app/uploads/products
      COD_PROOF_UPLOAD_PATH: /app/uploads/cod-proofs
      DOC_CHANGE_UPLOAD_PATH: /app/uploads/doc-changes
      LABELS_SERVICE_URL: http://labels-service:8084
      ME_API_URL: ${ME_API_URL:-https://melhorenvio.com.br/api/v2}
      ME_TOKEN: ${ME_TOKEN:-}
      # AUDIT-2026-07-28: confirmação manual (ops) de estorno pendente de
      # cancelamento de expedição — POST /wallet/estornos-pendentes/{id}/confirmar.
      WALLET_SERVICE_URL: http://wallet-service:8081
      WALLET_INTERNAL_SECRET: ${WALLET_INTERNAL_SECRET:-}
      # AUDIT-2026-07-30/31: mesmo secret do labels-service — admin-service
      # ENVIA esse header em todo proxy pro labels-service /internal/*.
      LABELS_INTERNAL_SECRET: ${LABELS_INTERNAL_SECRET:-}
    volumes:
      - falk_uploads:/app/uploads
    networks: [falk-net]
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }

  cron:
    # Runner de cron (go/cron) — daemon de instância única, SEM porta HTTP. Dispara
    # as funções Postgres idempotentes (sz_cod_release_due, sz_affiliate_release_due,
    # sz_referral_payout, sz_cleanup_expired_sessions, sz_cancel_preagendados_vencidos,
    # LGPD sz_anonymize_*) a cada CRON_INTERVAL_SECONDS. Sem ele NADA dispara os jobs.
    # ATENÇÃO FINANCEIRO: na 1ª execução libera COD/comissões represados (efeito desejado).
    build: { context: ../../go/cron, dockerfile: Dockerfile }
    container_name: falk-cron
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-falk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-falk}?sslmode=disable
      CRON_INTERVAL_SECONDS: ${CRON_INTERVAL_SECONDS:-300}
      # NÃO definir CRON_RUN_ONCE (=1 roda 1x e sai 0 — só p/ smoke test).
      # NÃO definir WEBHOOK_ALLOW_LOOPBACK (ausente = SSRF guard ativo, default seguro).
      TZ: America/Sao_Paulo
    networks: [falk-net]
    depends_on:
      postgres: { condition: service_healthy }
      migrate-runner: { condition: service_completed_successfully }

  admin-ui:
    build: { context: ../../admin-ui, dockerfile: Dockerfile }
    container_name: falk-admin-ui
    restart: unless-stopped
    networks: [falk-net]

  portal-ui:
    build: { context: ../../portal-ui, dockerfile: Dockerfile }
    container_name: falk-portal-ui
    restart: unless-stopped
    networks: [falk-net]

  checkout-ui:
    build:
      context: ../../checkout-ui
      dockerfile: Dockerfile
      args:
        VITE_GA4_MEASUREMENT_ID: ${VITE_GA4_MEASUREMENT_ID:-G-22GCCY3KMP}
    container_name: falk-checkout-ui
    restart: unless-stopped
    networks: [falk-net]

  motoboy-pwa:
    build: { context: ../../motoboy-pwa, dockerfile: Dockerfile }
    container_name: falk-motoboy-pwa
    restart: unless-stopped
    networks: [falk-net]

  gateway:
    image: nginx:alpine
    container_name: falk-gateway
    restart: unless-stopped
    volumes:
      - ../falk/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:9088:80"
    networks: [falk-net]
    depends_on: [admin-ui, checkout-ui]

  lp:
    image: nginx:alpine
    container_name: falk-lp
    restart: unless-stopped
    volumes:
      - ../falk/lp:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:9090:80"
    networks: [falk-net]

volumes:
  falk_pg_data:
    driver: local
  falk_uploads:
    driver: local

networks:
  falk-net:
    driver: bridge
