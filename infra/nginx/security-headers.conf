# =============================================================================
# security-headers.conf — Cabeçalhos de segurança HTTP (reutilizável via include)
#
# COMO USAR: dentro do `server { ... }` (ou de um location), adicionar:
#     include /etc/nginx/conf.d/security-headers.conf;
#
# Já está referenciado por senderzz-gateway.conf (server 443). Mantemos os
# headers num arquivo único para que os 3 front-ends (admin-ui, portal-ui,
# checkout-ui) e o WordPress herdem a MESMA política — evita drift.
#
# IMPORTANTE sobre `add_header` no nginx: add_header NÃO é herdado para um
# `location` que tenha o SEU PRÓPRIO add_header. Como nenhum location do gateway
# redefine estes headers, o include no nível do server cobre todas as respostas.
# O sufixo `always` garante o header também em respostas de erro (4xx/5xx).
# =============================================================================

# ── HSTS — força HTTPS por 1 ano, inclui subdomínios e habilita preload ────────
# Só faz efeito sobre HTTPS (o server :80 só redireciona). preload exige que o
# domínio esteja na lista do navegador; manter apenas com TLS válido em produção.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ── Anti-MIME-sniffing ─────────────────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;

# ── Anti-clickjacking ──────────────────────────────────────────────────────────
# X-Frame-Options para navegadores legados; frame-ancestors (na CSP abaixo) é o
# controle moderno e tem precedência. Ambos = SAMEORIGIN.
add_header X-Frame-Options "SAMEORIGIN" always;

# ── Vazamento de Referer ───────────────────────────────────────────────────────
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── Permissions-Policy — câmera/geolocalização só na própria origem ────────────
# A PWA do motoboy usa câmera (leitura de QR) e geolocalização; manter `self`.
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

# ── Content-Security-Policy ────────────────────────────────────────────────────
# DECISÃO: CSP em modo ENFORCING (não Report-Only). As SPAs (Vite/React) são
# servidas com scripts/estilos a partir da própria origem; o 'unsafe-inline' em
# script-src/style-src é necessário porque:
#   - WordPress/Woo e o admin clássico ainda emitem <script>/<style> inline;
#   - o build do Vite injeta estilos inline em runtime.
# Endurecimentos aplicados em relação ao default permissivo:
#   - frame-ancestors 'self'  → trava embedding cruzado (reforça X-Frame-Options);
#   - object-src 'none'       → mata plugins/Flash/applets;
#   - base-uri 'self'         → impede sequestro de <base> p/ exfiltrar caminhos;
#   - form-action 'self'      → POST de formulário só p/ a própria origem.
# img-src libera https: e data: por causa do QR gerado via api.qrserver.com e de
# imagens de produto em CDNs. connect-src 'self' cobre as chamadas REST do gateway.
#
# SE for endurecer ainda mais (remover 'unsafe-inline'), faça primeiro em
# Report-Only por alguns dias para colher violações sem quebrar a UI:
#   add_header Content-Security-Policy-Report-Only "<mesma policy>; report-uri /csp-report" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
