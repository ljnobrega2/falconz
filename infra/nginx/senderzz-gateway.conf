# =============================================================================
# Senderzz — Nginx Gateway (Strangler Fig — Fases 1–6)
#
# Ordem de migração (ativar progressivamente comentando/descomentando blocos):
#   Fase 1: sz-motoboy     → motoboy_go  :8080
#   Fase 2: tp-carteira    → wallet_go   :8081
#   Fase 3: affiliates     → affiliates_go :8083
#   Fase 4: wc-melhor-envio → labels_go  :8084
#   Fase 5: portal         → portal_go   :8085
#   Fase 6: orders         → orders_go   :8086
#   Fase 7: tudo → Go, desligar WP
#
# Instalar em: /etc/nginx/conf.d/senderzz-gateway.conf
# Testar:  nginx -t
# Reload:  nginx -s reload
# =============================================================================

# ── Upstreams ─────────────────────────────────────────────────────────────────

upstream wordpress {
    server 127.0.0.1:80;
    keepalive 32;
}

# Fase 1: Motoboy (sz-motoboy/v1)
upstream motoboy_go {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Fase 2: Wallet + PIX (tp-carteira/v1)
upstream wallet_go {
    server 127.0.0.1:8081;
    keepalive 32;
}

# Fase 3: Affiliates + COD (senderzz/v1 affiliates + cod)
upstream affiliates_go {
    server 127.0.0.1:8083;
    keepalive 32;
}

# Fase 4: Labels + Melhor Envio (wc-melhor-envio/v1)
upstream labels_go {
    server 127.0.0.1:8084;
    keepalive 32;
}

# Fase 5: Portal (senderzz/v1 portal auth + webhooks + settings)
upstream portal_go {
    server 127.0.0.1:8085;
    keepalive 32;
}

# Fase 6: Orders (senderzz/v1 orders + payments)
upstream orders_go {
    server 127.0.0.1:8086;
    keepalive 32;
}

# Admin service (senderzz/v1/admin)
upstream admin_go {
    server 127.0.0.1:8087;
    keepalive 16;
}

# Admin UI (React SPA)
upstream admin_ui {
    server 127.0.0.1:8089;
    keepalive 8;
}

# ── Redirect HTTP → HTTPS ─────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name app.senderzz.com.br;
    return 301 https://$host$request_uri;
}

# ── HTTPS principal ───────────────────────────────────────────────────────────

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.senderzz.com.br;

    # ── TLS ───────────────────────────────────────────────────────────────────
    ssl_certificate      /etc/letsencrypt/live/app.senderzz.com.br/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/app.senderzz.com.br/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.senderzz.com.br/chain.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout  1d;
    ssl_session_cache    shared:SSL:10m;
    ssl_stapling         on;
    ssl_stapling_verify  on;

    # ── Cabeçalhos de segurança ───────────────────────────────────────────────
    # Fonte única (HSTS, nosniff, X-Frame-Options, Referrer-Policy, CSP endurecida,
    # Permissions-Policy). Editar a política em infra/nginx/security-headers.conf.
    # Em produção, instalar esse arquivo em /etc/nginx/conf.d/security-headers.conf.
    include /etc/nginx/conf.d/security-headers.conf;

    # ── CSP endurecida em Report-Only (paralela à enforcing acima) ────────────
    # Emite Content-Security-Policy-Report-Only com política ESTRITA (sem
    # 'unsafe-inline'). NÃO bloqueia nada — o browser só RELATA o que a política
    # estrita barraria, alimentando o sink /csp-report abaixo. Passo final
    # report-only → enforcing está BLOQUEADO em trabalho de APP (nonce/hash p/
    # inline do Vite/PWA/WP) — fora do escopo de infra. Ver csp-report-only.conf.
    include /etc/nginx/conf.d/csp-report-only.conf;

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/senderzz-access.log;
    error_log  /var/log/nginx/senderzz-error.log warn;

    # ── Health checks dos Go services ─────────────────────────────────────────
    location = /health/motoboy    { proxy_pass http://motoboy_go/health;    access_log off; }
    location = /health/wallet     { proxy_pass http://wallet_go/health;     access_log off; }
    location = /health/affiliates { proxy_pass http://affiliates_go/health; access_log off; }
    location = /health/labels     { proxy_pass http://labels_go/health;     access_log off; }
    location = /health/portal     { proxy_pass http://portal_go/health;     access_log off; }
    location = /health/orders     { proxy_pass http://orders_go/health;     access_log off; }
    location = /health/admin      { proxy_pass http://admin_go/healthz;     access_log off; }

    # ── Sink de relatórios CSP (Report-Only) ──────────────────────────────────
    # Absorve os POST de violação da CSP estrita (csp-report-only.conf) → 204.
    # Mata ruído de 404 e prova, no devtools, que o Report-Only está ativo.
    # LIMITAÇÃO: `return 204` não lê o corpo → $request_body vazio (o JSON da
    # violação NÃO é gravado aqui; usar devtools/coletor dedicado p/ triagem).
    location = /csp-report {
        access_log /var/log/nginx/csp-violations.log;
        if ($request_method != POST) { return 405; }
        return 204;
    }

    # ── PROXY MACRO ───────────────────────────────────────────────────────────
    # Usado nos location blocks abaixo via include (nginx ≥1.25 suporta variáveis
    # em proxy_pass; para versões antigas, duplicar o bloco).

    # ── Admin UI (React SPA) ──────────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://admin_ui/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Rate-limit de borda: LOGIN do ADMIN (match exato vence o prefixo) ─────
    # Zona sz_login (rate-limit.conf, 10r/m por IP). burst=5 nodelay tolera
    # retry/duplo-clique; 6º+ no minuto → 429. Proxy idêntico ao prefixo admin.
    location = /wp-json/senderzz/v1/admin/login {
        limit_req zone=sz_login burst=5 nodelay;
        proxy_pass         http://admin_go;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Admin API (Go service) ────────────────────────────────────────────────
    location /wp-json/senderzz/v1/admin/ {
        proxy_pass         http://admin_go;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # ── Rate-limit de borda: LOGIN do MOTOBOY (Fase 1 ATIVA → motoboy_go) ─────
    # Regex casa /wp-json/sz-motoboy/v1/login* ANTES do prefixo abaixo (regex
    # tem precedência sobre prefixo; ordem de arquivo decide entre regexes).
    location ~ ^/wp-json/sz-motoboy/v1/login {
        limit_req zone=sz_login burst=5 nodelay;
        proxy_pass         http://motoboy_go;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Fase 1: Motoboy ───────────────────────────────────────────────────────
    location /wp-json/sz-motoboy/v1/ {
        proxy_pass         http://motoboy_go;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_buffering    off;
        proxy_pass_header  Set-Cookie;
    }

    # ── Fase 2: Wallet + PIX ──────────────────────────────────────────────────
    # Ativar após 30 dias de double-write estável.
    # Para ativar: remover o comentário abaixo.
    #
    # ATENÇÃO: endpoint /tp-carteira/v1/pix/webhook é crítico (financeiro).
    # Só ativar quando reconcile diário mostrar 0 divergências por 14 dias.
    #
    # ── Rate-limit de borda: WEBHOOK PIX (financeiro, match exato) ────────────
    # Zona sz_webhook (60r/m por IP). burst=20 nodelay cobre rajadas legítimas de
    # notificação. Webhook já é fail-closed por HMAC na app; isto só evita flood.
    # Match exato vence o prefixo /tp-carteira/ abaixo. Upstream segue wordpress
    # (Fase 2 inativa); trocar p/ wallet_go na Fase 2.
    location = /wp-json/tp-carteira/v1/pix/webhook {
        limit_req zone=sz_webhook burst=20 nodelay;
        proxy_pass         http://wordpress;   # trocar p/ wallet_go na Fase 2
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /wp-json/tp-carteira/v1/ {
        # FASE 2 INATIVA — descomentar após cutover confirmado:
        # proxy_pass         http://wallet_go;
        # proxy_http_version 1.1;
        # proxy_set_header   Host              $host;
        # proxy_set_header   X-Real-IP         $remote_addr;
        # proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # proxy_set_header   X-Forwarded-Proto $scheme;
        # proxy_set_header   Connection        "";
        # proxy_connect_timeout 5s;
        # proxy_read_timeout    30s;

        # Enquanto inativo, todo tráfego vai pro WP:
        proxy_pass         http://wordpress;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Fase 3: Affiliates + COD ──────────────────────────────────────────────
    # Ativar após Fase 2 estável.
    location ~ ^/wp-json/senderzz/v1/(affiliates|cod)/ {
        # FASE 3 INATIVA:
        proxy_pass         http://wordpress;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Ativar: trocar proxy_pass acima por http://affiliates_go
    }

    # ── Rate-limit de borda: WEBHOOK de RASTREAMENTO (match exato) ────────────
    # Zona sz_webhook (60r/m). Match exato vence o prefixo /wc-melhor-envio/
    # abaixo. Upstream segue wordpress (Fase 4 inativa); trocar p/ labels_go.
    location = /wp-json/wc-melhor-envio/v1/webhook/tracking {
        limit_req zone=sz_webhook burst=20 nodelay;
        proxy_pass         http://wordpress;   # trocar p/ labels_go na Fase 4
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Rate-limit de borda: COTAÇÃO DE FRETE (checkout, match exato) ─────────
    # GET /wc-melhor-envio/v1/calculate é a cotação de frete usada pelo checkout
    # (proxy p/ ME.Calculate com cache de 10 min, protegido por JWT). Cada miss
    # de cache vai à API da Melhor Envio, então limitamos a borda como defesa em
    # profundidade contra flood/scraping de cotação. Usa a zona sz_webhook
    # (60r/m, burst=20 nodelay) — tier interativo correto; sz_login (10r/m)
    # quebraria o uso normal de checkout. Match exato vence o prefixo
    # /wc-melhor-envio/ abaixo. Upstream segue wordpress (Fase 4 inativa);
    # trocar p/ labels_go na Fase 4.
    location = /wp-json/wc-melhor-envio/v1/calculate {
        limit_req zone=sz_webhook burst=20 nodelay;
        proxy_pass         http://wordpress;   # trocar p/ labels_go na Fase 4
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout    120s;
    }

    # ── Fase 4: Labels + Melhor Envio ─────────────────────────────────────────
    location /wp-json/wc-melhor-envio/v1/ {
        # FASE 4 INATIVA:
        proxy_pass         http://wordpress;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout    120s;
        # Ativar: trocar proxy_pass por http://labels_go; read_timeout 60s
    }

    # ── Rate-limit de borda: LOGIN do PORTAL (cobre login + 2FA) ──────────────
    # DEVE vir ANTES do bloco regex do prefixo /portal/ abaixo: entre locations
    # regex, a 1ª que casa (ordem de arquivo) vence. Fase 5 inativa → upstream
    # ainda é wordpress; o limit_req protege independente do upstream.
    location ~ ^/wp-json/senderzz/v1/portal/login {
        limit_req zone=sz_login burst=5 nodelay;
        proxy_pass         http://wordpress;   # trocar p/ portal_go na Fase 5
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Fase 5: Portal ────────────────────────────────────────────────────────
    # senderzz/v1/portal/* → portal-service
    location ~ ^/wp-json/senderzz/v1/portal/ {
        # FASE 5 INATIVA:
        proxy_pass         http://wordpress;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Ativar: trocar proxy_pass por http://portal_go
    }

    # ── Rate-limit de borda: WEBHOOK de PAGAMENTO (orders, Fase 6) ────────────
    # Zona sz_webhook (60r/m). Regex casa .../orders/payments/webhook/* ANTES do
    # prefixo de orders abaixo (ordem de arquivo decide entre regexes). Fase 6
    # inativa → upstream wordpress; trocar p/ orders_go na Fase 6.
    location ~ ^/wp-json/senderzz/v1/orders/payments/webhook/ {
        limit_req zone=sz_webhook burst=20 nodelay;
        proxy_pass         http://wordpress;   # trocar p/ orders_go na Fase 6
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Fase 6: Orders ────────────────────────────────────────────────────────
    location ~ ^/wp-json/senderzz/v1/orders/ {
        # FASE 6 INATIVA:
        proxy_pass         http://wordpress;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        # Ativar: trocar proxy_pass por http://orders_go
    }

    # ── senderzz/v1 restante (não mapeado ainda) → WordPress ─────────────────
    location /wp-json/senderzz/v1/ {
        proxy_pass         http://wordpress;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout    60s;
    }

    # ── WordPress — fallback ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://wordpress;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_buffering    on;
        proxy_buffer_size  16k;
        proxy_buffers      8 32k;
    }

    # ── Arquivos estáticos ────────────────────────────────────────────────────
    # ⚠️ REGRA DO NGINX: um `location` que define QUALQUER `add_header` próprio
    # NÃO herda os `add_header` do nível `server{}`. Este bloco tem o seu próprio
    # `add_header Cache-Control`, então sem o include abaixo os arquivos servidos
    # direto de /var/www/html (JS/CSS/imagens) sairiam SEM os 6 cabeçalhos de
    # segurança (nosniff/HSTS/X-Frame-Options/Referrer-Policy/Permissions-Policy/
    # CSP). O `include` re-aplica TODOS eles aqui dentro. O mais crítico é o
    # `X-Content-Type-Options: nosniff` em respostas .js/.css servidas direto
    # (impede MIME-sniffing de assets). Não re-incluímos csp-report-only.conf:
    # CSP/frame-ancestors em resposta de asset estático é inócuo.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root    /var/www/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Re-aplica os cabeçalhos de segurança (suprimidos pelo add_header acima):
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
        try_files $uri @wordpress;
    }

    location @wordpress {
        proxy_pass http://wordpress;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Certbot ACME ─────────────────────────────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
