#
# NOTA sobre `burst` + `nodelay`: burst=5 deixa 5 requests acima da taxa
# passarem imediatamente (nodelay = sem enfileirar/atrasar); o 6º+ no mesmo
# minuto leva 429. Isso tolera retry/duplo-clique legítimo sem abrir brecha de
# brute-force. Ajustar burst conforme telemetria de 429 em produção.
# =============================================================================
