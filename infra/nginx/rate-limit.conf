# =============================================================================
# rate-limit.conf — Rate-limit de BORDA (defesa em profundidade)
#
# POR QUE: a aplicação já tem rate-limit próprio (admin: ADMIN_LOGIN_RATE_MAX +
# auth.LoginRateLimit; portal: PORTAL_LOGIN_RL_IP_MAX/EMAIL_MAX). Este arquivo
# é uma SEGUNDA camada, no nginx, que barra abuso ANTES de o request chegar ao
# Go/WP — protege contra brute-force de login e flood de webhook mesmo que a
# app esteja sobrecarregada ou o rate-limit de app seja afrouxado em dev.
#
# DUAS PARTES, dois contextos diferentes do nginx:
#   (A) `limit_req_zone`  → contexto HTTP (fora de qualquer server{}). Declara
#       as zonas de memória compartilhada e a taxa. VAI NO TOPO de um arquivo
#       incluído em http{} — por isso ESTE arquivo deve ser incluído via
#       `include` no nível http (ex.: dentro de /etc/nginx/nginx.conf no bloco
#       http{}, ou em /etc/nginx/conf.d/ que o nginx.conf padrão já inclui em
#       http{}). NÃO incluir dentro de server{}.
#   (B) `limit_req`       → contexto LOCATION. Aplica a zona à rota. Os trechos
#       de exemplo ao final mostram ONDE colá-los dentro do senderzz-gateway.conf.
#
# INSTALAR: /etc/nginx/conf.d/rate-limit.conf  (conf.d é incluído em http{} pelo
# nginx.conf padrão → as zonas abaixo ficam no contexto certo). Testar: nginx -t.
#
# ⚠️ ORDEM DE CARGA: as `limit_req_zone` (aqui) precisam ser processadas ANTES
# de qualquer `limit_req` (em senderzz-gateway.conf), senão `nginx -t` falha com
# "unknown limit_req zone". Hoje funciona porque o nginx inclui os arquivos de
# conf.d em ordem ALFABÉTICA e "rate-limit.conf" < "senderzz-gateway.conf". Se um
# desses arquivos for renomeado, garantir que este continue ordenando antes (ou
# incluí-lo explicitamente mais cedo no bloco http{} do nginx.conf).
# =============================================================================

# ── (A) ZONAS — contexto http (este arquivo é incluído em http{}) ─────────────
#
# $binary_remote_addr: chave por IP (forma binária, ~16 bytes/entrada → 10m
# comporta ~160k IPs distintos). Se o nginx está atrás de outro proxy/CDN,
# garantir set_real_ip_from + real_ip_header para $binary_remote_addr refletir
# o IP real do cliente, não o do proxy.
#
# rate=Nr/m: N requisições por minuto sustentadas por IP. burst (no limit_req)
# permite picos curtos acima da taxa antes de começar a atrasar/rejeitar.

# Zona de LOGIN — agressiva: brute-force de senha é o alvo. 10 req/min por IP.
limit_req_zone $binary_remote_addr zone=sz_login:10m rate=10r/m;

# Zona de WEBHOOK — entrada de gateways externos (PIX, pagamento, rastreio).
# Tráfego legítimo é esporádico; 60 req/min por IP cobre rajadas de
# notificação sem permitir flood. Webhooks já são fail-closed por HMAC na app;
# isto só evita que um flood chegue ao handler.
limit_req_zone $binary_remote_addr zone=sz_webhook:10m rate=60r/m;

# Resposta quando o limite estoura: 429 Too Many Requests (padrão nginx é 503,
# que confunde com indisponibilidade real). 429 é o código semanticamente certo.
limit_req_status 429;

# =============================================================================
# (B) ONDE APLICAR — trechos para colar dentro do server{} de
#     senderzz-gateway.conf. NÃO são incluídos automaticamente: o gateway
#     define as locations; basta adicionar a linha `limit_req` na location certa
#     (ou criar a location aninhada de login indicada abaixo).
#
# As rotas de login NÃO têm location própria hoje (caem na location do prefixo
# do serviço). Criar uma location EXACT (`location = ...`) aninhada/irmã, com o
# MESMO proxy_pass do prefixo, só para anexar o limit_req. Exemplos:
# -----------------------------------------------------------------------------
#
#   # ── Login do ADMIN (Go) — /wp-json/senderzz/v1/admin/login ──────────────
#   # Colocar ANTES da location de prefixo /wp-json/senderzz/v1/admin/ para ter
#   # precedência (match exato vence prefixo no nginx).
#   location = /wp-json/senderzz/v1/admin/login {
#       limit_req zone=sz_login burst=5 nodelay;
#       proxy_pass         http://admin_go;
#       proxy_http_version 1.1;
#       proxy_set_header   Host              $host;
#       proxy_set_header   X-Real-IP         $remote_addr;
#       proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header   X-Forwarded-Proto $scheme;
#       proxy_set_header   Connection        "";
#   }
