# =============================================================================
# csp-report-only.conf — Caminho de ENDURECIMENTO da CSP (não-bloqueante)
#
# OBJETIVO: rodar, EM PARALELO com a CSP enforcing atual de
# `security-headers.conf`, uma política MAIS ESTRITA em modo Report-Only.
# Report-Only NÃO bloqueia nada — o browser só RELATA o que a política estrita
# teria barrado. Isso deixa colher violações reais (do Vite/React, do WP admin
# clássico, da PWA) por alguns dias ANTES de migrar a política estrita para
# enforcing — sem risco de quebrar a UI.
#
# DIFERENÇA para a política enforcing (security-headers.conf, linha 54):
#   - REMOVE 'unsafe-inline' de script-src e style-src;
#   - exige nonce/hash para todo <script>/<style> inline (TODO de app, abaixo);
#   - adiciona report-uri + report-to → coletor de violações.
#
# COMO USAR (em paralelo, sem desligar a enforcing):
#   Dentro do MESMO `server { ... }` que já faz
#       include /etc/nginx/conf.d/security-headers.conf;
#   adicionar logo abaixo:
#       include /etc/nginx/conf.d/csp-report-only.conf;
#   As duas linhas `Content-Security-Policy` (enforcing) e
#   `Content-Security-Policy-Report-Only` (estrita) coexistem: o browser
#   APLICA a primeira e RELATA violações da segunda. Sem conflito.
#
# IMPORTANTE: este arquivo NÃO substitui security-headers.conf. Ele é aditivo
# e descartável — quando a política estrita migrar para enforcing (passo 4 do
# roteiro abaixo), edita-se a linha em security-headers.conf e remove-se este
# include.
# =============================================================================

# ── Reporting-Endpoints (Report-To moderno, nível Reporting API v1) ───────────
# `report-to` na CSP referencia um GRUPO nomeado declarado aqui. Navegadores
# Chromium recentes preferem este mecanismo; Firefox/Safari ainda usam
# `report-uri` (ambos abaixo, por compatibilidade).
add_header Reporting-Endpoints 'csp-endpoint="/csp-report"' always;

# Cabeçalho legado Report-To (Reporting API v0) — alguns Chromium intermediários
# só entendem este formato. max_age em segundos (10 dias).
add_header Report-To '{"group":"csp-endpoint","max_age":864000,"endpoints":[{"url":"/csp-report"}]}' always;

# ── CSP ESTRITA em Report-Only ────────────────────────────────────────────────
# script-src/style-src SEM 'unsafe-inline'. Como o app ainda emite inline (ver
# TODO), em Report-Only isso GERA RELATÓRIO mas NÃO bloqueia — é exatamente o
# sinal que se quer coletar antes de endurecer de verdade.
#
# TODO (app — pré-requisito para migrar esta política a enforcing):
#   [script-src] Para remover 'unsafe-inline' sem nonce, o Vite/React e o WP
#     admin clássico precisam parar de injetar <script> inline OU passar a
#     receber um nonce por requisição. Caminhos:
#       (a) Nonce: nginx gera $request_id por request; injetar como nonce-XXXX
#           tanto no header (script-src 'nonce-$request_id') quanto em cada
#           <script nonce="..."> do HTML. Exige o app/SSR carimbar o nonce no
#           markup — NÃO é possível só no nginx (HTML é estático/SPA). É uma
#           mudança de APP (fora do escopo desta frente de infra).
#       (b) Hash: para os poucos inlines fixos (ex.: bootstrap do Vite), usar
#           'sha256-...' calculado do conteúdo exato. Quebra a cada rebuild que
#           altere o trecho — automatizar no pipeline de build.
#       Bloqueadores concretos hoje:
#         - Vite injeta estilos inline em runtime (style-src);
#         - PWA do motoboy registra service worker e usa <script> inline;
#         - WP/Woo admin clássico emite <script>/<style> inline herdados.
#   [style-src] É o mais difícil de endurecer: o runtime do Vite aplica estilos
#     inline (style="...") que 'nonce-'/'sha256-' NÃO cobrem (nonce/hash valem
#     para <style>, não para atributos style=""). Provável necessidade de manter
#     'unsafe-inline' em style-src OU migrar para CSS-in-JS com nonce. Avaliar
#     com base nos relatórios coletados antes de decidir.
#
# Demais diretivas: idênticas à enforcing (frame-ancestors/object-src/base-uri/
# form-action/img-src/font-src/connect-src) — o que muda é só a remoção do
# 'unsafe-inline' e a adição de report-uri/report-to.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /csp-report; report-to csp-endpoint" always;

# =============================================================================
# ROTEIRO Report-Only → ENFORCING (sem quebrar o SPA Vite/PWA)
# =============================================================================
#
# 1. INCLUIR este arquivo no server{} (em paralelo com security-headers.conf).
#    Coletar violações por 7–14 dias cobrindo: login admin, portal, checkout,
#    PWA do motoboy (câmera/QR), fluxo de etiqueta. Quanto mais superfície
#    exercitada, mais completo o inventário de inlines.
#
# 2. ANALISAR o log /var/log/nginx/csp-violations.log (location abaixo). Cada
#    linha = um recurso/inline que a política estrita barraria. Classificar:
#       - inline ESSENCIAL  → precisa de nonce/hash no app (TODO acima);
#       - origem externa legítima (CDN de imagem etc.) → já coberta por img-src;
#       - ruído/extensão de browser → ignorar (não vem do nosso código).
#
# 3. ENDURECER O APP até os relatórios de inline essencial zerarem:
#       - adicionar nonce por request (SSR/template carimba <script nonce>);
#       - OU hashes 'sha256-' dos inlines fixos no build;
#       - style-src: decidir manter 'unsafe-inline' (se Vite inline-style for
#         inevitável) ou migrar. Documentar a decisão final aqui.
#
# 4. MIGRAR PARA ENFORCING: quando os relatórios estiverem limpos, editar a
#    linha `Content-Security-Policy` em security-headers.conf trocando o valor
#    permissivo pela política estrita validada aqui (com nonce/hash já no app),
#    e REMOVER o include deste arquivo. Manter report-uri/report-to na enforcing
#    para detectar regressões (CSP enforcing também aceita report-uri).
#
# 5. ROLLBACK: se algo quebrar após o passo 4, reverter a linha em
#    security-headers.conf para a versão com 'unsafe-inline' e `nginx -s reload`.
#    Zero downtime; é só troca de header.
# =============================================================================
#
# COLETOR DE VIOLAÇÕES (sink) — adicionar ESTE location dentro do server{} do
# gateway (senderzz-gateway.conf).
#
#   # Sink mínimo de relatórios CSP — ABSORVE os reports (mata ruído de 404 e
#   # confirma, no devtools, que o browser está disparando) e devolve 204.
#   location = /csp-report {
#       access_log /var/log/nginx/csp-violations.log;
#       # Aceita só POST; outros métodos → 405.
#       if ($request_method != POST) { return 405; }
#       # 204: o browser não espera corpo de resposta no endpoint de report.
#       return 204;
#   }
#
# ⚠️ LIMITAÇÃO REAL deste sink mínimo: `return 204` curto-circuita pelo módulo
# rewrite e NÃO lê o corpo da requisição — `$request_body` fica VAZIO. Ou seja,
# o access_log registra QUE houve um report (e o IP/UA), mas NÃO o JSON da
# violação. Não dá para capturar o conteúdo da violação só com nginx + `return`.
# O location acima serve para (a) absorver o POST sem 404, (b) provar que o
# Report-Only está ativo (hits aparecem). Para a TRIAGEM de violações use o
# devtools do browser (aba Console/Issues mostra cada violação) durante o passo 2.
#
# Para CAPTURAR e agregar o JSON das violações (recomendado p/ o passo 2 em
# escala), apontar report-uri/report-to para um COLETOR DEDICADO — não dá pra
# fazer só no nginx (fora do escopo desta frente, NÃO editar Go aqui):
#   - serviço externo: report-uri.com, Sentry (CSP reporting), Datadog;
#   - OU um pequeno handler próprio que faz `proxy_pass` deste location para um
#     endpoint que lê o corpo e persiste (qualquer linguagem; lê application/
#     csp-report e application/reports+json).
# =============================================================================
