resolver 127.0.0.11 valid=10s ipv6=off;
server {
    listen 80 default_server; server_name _; client_max_body_size 64m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-FALK-Env "TESTES" always;
    gzip on; gzip_vary on; gzip_comp_level 5; gzip_min_length 1024; gzip_types text/css application/javascript application/json image/svg+xml;
    location ~ ^/wp-json/sz-motoboy/v1/ { set $up falk-test-motoboy:8080; proxy_pass http://$up; proxy_set_header Host $host; proxy_http_version 1.1; }
    location ~ ^/wp-json/tp-carteira/v1/ { set $up falk-test-wallet:8081; proxy_pass http://$up; proxy_set_header Host $host; proxy_http_version 1.1; }
    location ~ ^/wp-json/wc-melhor-envio/v1/ { set $up falk-test-labels:8084; proxy_pass http://$up; proxy_set_header Host $host; proxy_http_version 1.1; }
    location ~ ^/wp-json/senderzz/v1/portal/ { set $up falk-test-portal:8085; proxy_pass http://$up; proxy_set_header Host $host; proxy_http_version 1.1; }
    location ~ ^/wp-json/senderzz/v1/(affiliates|cod) { set $up falk-test-affiliates:8083; proxy_pass http://$up; proxy_set_header Host $host; proxy_http_version 1.1; }
    location ^~ /wp-json/senderzz/v1/admin/ { set $up falk-test-admin:8087; proxy_pass http://$up; proxy_set_header Host $host; proxy_http_version 1.1; }
    location ~ ^/wp-json/senderzz/v1/ { set $up falk-test-orders:8086; proxy_pass http://$up; proxy_set_header Host $host; proxy_http_version 1.1; }
    location = /healthz { return 200 "falk-test-gateway ok\n"; add_header Content-Type text/plain; }
    # COMPAT — admin-ui base /admin/ → raiz /. URLs antigas /admin/* redirecionam preservando subpath.
    location = /admin  { return 301 /; }
    location /admin/   { rewrite ^/admin/(.*)$ /$1 redirect; }
    location ^~ /portal/assets/ { set $pu falk-test-portal-ui:80; rewrite ^/portal/(.*)$ /$1 break; proxy_pass http://$pu; proxy_set_header Host $host; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /portal/ { set $pu falk-test-portal-ui:80; rewrite ^/portal/(.*)$ /$1 break; proxy_pass http://$pu; proxy_set_header Host $host; add_header Cache-Control "no-cache, must-revalidate" always; }
    # admin-ui servido na RAIZ — base '/'. Assets imutáveis em /assets/ (sem rewrite).
    location ^~ /assets/ { set $ui falk-test-admin-ui:80; proxy_pass http://$ui; proxy_set_header Host $host; add_header X-Content-Type-Options nosniff always; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    # Catch-all = admin-ui (SPA fallback no nginx interno via try_files /index.html).
    location / { set $ui falk-test-admin-ui:80; proxy_pass http://$ui; proxy_set_header Host $host; add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always; add_header Cache-Control "no-cache, must-revalidate" always; }
}
