resolver 127.0.0.11 valid=10s ipv6=off;

# O admin é recriado com frequência e pode receber outro IP na rede Docker.
# `resolve` no upstream atualiza o endereço em background; depender apenas de
# resolver variável deixou o worker preso no IP anterior e derrubou toda a API
# administrativa com 502 até um reload manual do gateway.
upstream falk_admin_backend {
    zone falk_admin_backend 64k;
    server falk-admin:8087 resolve;
}

map $sent_http_content_type $nocache_html { default ""; "~*text/html" "no-cache, must-revalidate"; }
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 64m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
    gzip on; gzip_vary on; gzip_comp_level 5; gzip_min_length 1024; gzip_types text/css application/javascript application/json image/svg+xml;

    location ~ ^/wp-json/sz-motoboy/v1/ { set $up falk-motoboy:8080; proxy_pass http://$up; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; }
    location ~ ^/wp-json/tp-carteira/v1/ { set $up falk-wallet:8081; proxy_pass http://$up; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; }
    location ~ ^/wp-json/wc-melhor-envio/v1/ { set $up falk-labels:8084; proxy_pass http://$up; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; }
    location ~ ^/wp-json/senderzz/v1/portal/ { set $up falk-portal:8085; proxy_pass http://$up; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; }
    location ~ ^/wp-json/senderzz/v1/(affiliates|cod) { set $up falk-affiliates:8083; proxy_pass http://$up; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; }
    location ^~ /wp-json/senderzz/v1/admin/ { proxy_pass http://falk_admin_backend; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; }
    # Imagens de produto (upload admin) — servidas pelo FileServer do falk-admin. Públicas (vitrine/checkout).
    location ^~ /uploads/products/ { proxy_pass http://falk_admin_backend; proxy_set_header Host $host; proxy_http_version 1.1; add_header Cache-Control "public, max-age=86400" always; }
    location ~ ^/wp-json/senderzz/v1/ { set $up falk-orders:8086; proxy_pass http://$up; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; }

    # Motoboy PWA — standalone SPA servida pelo falk-motoboy-pwa
    location ^~ /motoboy/assets/ { set $mp falk-motoboy-pwa:80; proxy_pass http://$mp; proxy_set_header Host $host; proxy_http_version 1.1; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /motoboy/ { set $mp falk-motoboy-pwa:80; rewrite ^/motoboy/(.*)$ /$1 break; proxy_pass http://$mp; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; add_header X-Content-Type-Options nosniff always; add_header Cache-Control "no-cache, must-revalidate" always; add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always; }

    # Checkout público (customer-facing): API literal /checkout-api/* no orders; SPA base /checkout/ no checkout-ui
    location ^~ /checkout-api/ { set $up falk-orders:8086; proxy_pass http://$up; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; }
    # API pública de pedidos (menu Integrações do portal) — auth por API key própria (Bearer), não JWT.
    location ^~ /api/v1/ { set $up falk-orders:8086; proxy_pass http://$up; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; }

    # Compatibilidade do painel admin — alguns clientes/documentações usam
    # /api/admin/*, enquanto o namespace canônico do serviço é
    # /wp-json/senderzz/v1/admin/*. O rewrite mantém a autenticação JWT e
    # impede que o catch-all da SPA transforme uma API ausente em HTML 200.
    location ^~ /api/admin/ {
        rewrite ^/api/admin/(.*)$ /wp-json/senderzz/v1/admin/$1 break;
        # Hostname estático evita perder a variável após o rewrite (o Nginx
        # reavalia a location depois do break).
        proxy_pass http://falk_admin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location ^~ /checkout/assets/ { set $cu falk-checkout-ui:80; rewrite ^/checkout/(.*)$ /$1 break; proxy_pass http://$cu; proxy_set_header Host $host; add_header X-Content-Type-Options nosniff always; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /checkout/ { set $cu falk-checkout-ui:80; rewrite ^/checkout/(.*)$ /$1 break; proxy_pass http://$cu; proxy_set_header Host $host; proxy_http_version 1.1; add_header X-Content-Type-Options nosniff always; add_header Cache-Control "no-cache, must-revalidate" always; }

    location = /healthz { return 200 "falk-gateway ok\n"; add_header Content-Type text/plain; }

    # COMPAT — admin-ui mudou de base /admin/ → raiz / (app.falklog.com.br RAIZ).
    # URLs antigas /admin/* redirecionam preservando o subpath (/admin/login → /login).
    location = /admin  { return 301 /; }
    location /admin/   { rewrite ^/admin/(.*)$ /$1 redirect; }

    location ^~ /portal/assets/ {
        set $pu falk-portal-ui:80;
        rewrite ^/portal/(.*)$ /$1 break;
        proxy_pass http://$pu;
        proxy_set_header Host $host; proxy_http_version 1.1;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    location /portal/ {
        set $pu falk-portal-ui:80;
        rewrite ^/portal/(.*)$ /$1 break;
        proxy_pass http://$pu;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    # admin-ui servido na RAIZ — base '/'. Assets imutáveis em /assets/ (sem rewrite).
    location ^~ /assets/ {
        set $ui falk-admin-ui:80;
        proxy_pass http://$ui;
        proxy_set_header Host $host; proxy_http_version 1.1;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
    # Catch-all = admin-ui (SPA fallback no nginx interno via try_files /index.html).
    location / {
        set $ui falk-admin-ui:80;
        proxy_pass http://$ui;
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
