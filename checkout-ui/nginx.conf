server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — o prefixo /checkout/ é reescrito p/ / no gateway FALK.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
}
