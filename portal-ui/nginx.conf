server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html referencia os assets com hash no nome — se ele ficar em
        # cache (browser/CDN), o app continua rodando o bundle JS antigo mesmo
        # depois de um deploy. Nunca cachear a shell.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
